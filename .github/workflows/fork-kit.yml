# fork-kit's guard for pull requests into the fork branch (docs/custom-fork.md). The
# sync itself runs centrally (BierDav/fork-kit, sync-forks.yml); this repository holds no App key.
name: fork-kit

on:
  # The guard runs the workflow as defined on the base branch and never checks
  # out the pull request's code, so the PR's content cannot change what it does.
  # labeled/unlabeled: the fork-kit:hold label takes effect at once.
  pull_request_target:
    branches: [patched]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  # Sets the fork-kit/hold status on every PR into the fork branch, failing
  # while it has the fork-kit:hold label (a required check). On the sync PR,
  # also turns auto-merge off when someone other than fork-kit pushed to it.
  guard:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    concurrency:
      group: fork-kit-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The base branch, not the pull request: nothing from the PR is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: BierDav/fork-kit@19f2b51e7edf71d5bf385dac66319e9a2a2448b8 # v0.4.0
        with:
          command: guard
          token: ${{ github.token }}
